<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>Hello World!</p>
    <div> Authenticated username: <span sec:authentication="name"></span></div>
    <div sec:authorize="hasRole('ROLE_ADMIN')">Text visible to ADMIN.</div>
    <div sec:authorize="hasRole('ROLE_EDITOR')">Text visible to EDITOR.</div>
    <div sec:authorize="hasRole('ROLE_APPROVER')">Text visible to APPROVER.</div>
    <div sec:authorize="isAuthenticated()">Text visible only to authenticated users.</div>
   
    <div>Email: <span sec:authentication="principal.email"></span></div>
    <div>ID: <span sec:authentication="principal.id"></span></div>

    <div>Other way to get email: <span th:text="${#authentication.principal.email}"></span></div>
    <div>User assign roel: <span sec:authentication="principal.authorities"></span></div>
    <div>Get login info from model: <span th:text="${loginuseremail}"></span></div>
</body>

</html>
