<html lang="en">

<head th:replace="~{fragments/head::common_head(title=${pagetitle})}"></head>


<body>
    <div class="container-fluid">
        <div class="row flex-nowrap">
            <div class="col-auto px-2 px-0">
                <div class="d-flex flex-column align-items-start px-3 pt-5 min-vh-100">
                    <!--logo area -->
                    <a th:replace="~{fragments/logoarea::text_logo(text=${pagetextlogo})}"></a>
                    <!--nav menu area-->
                    <!-- only this is changed between the non sign in page -->
                    <div th:replace="~{fragments/homeleftnavS::homeleftnavS}"></div>
                </div>
            </div>
            <div class="col p-0">
                <!--carosell area-->
                <div id="carouselLab" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner carousel-ref">
                        <div class="carousel-item active min-vh-100" data-bs-interval="5000">
                            <div class="rowoverlay carousel_grid carousel_slide1" aria-label="carousel image 1"> </div>
                        </div>
                        <div class="carousel-item min-vh-100" data-bs-interval="5000">
                            <div class="rowoverlay carousel_grid carousel_slide2" aria-label="carousel image 2"></div>
                        </div>
                        <div class="carousel-item min-vh-100" data-bs-interval="5000">
                            <div class="rowoverlay carousel_grid carousel_slide3" aria-label="carousel image 3"></div>
                        </div>
                        <div class="carousel-item min-vh-100" data-bs-interval="5000">
                            <div class="rowoverlay carousel_grid carousel_slide4" aria-label="carousel image 4"></div>
                        </div>
                    </div>
                    <div class="rowoverlay imgfilter">
                        <div class="backgroundGrid"></div>
                    </div>
                </div>

                <!-- search bar-->
                <div th:replace="~{fragments/topsearchbar::topsearchbar}"></div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/bodyend::bodyend}"></div>
</body>

</html>
