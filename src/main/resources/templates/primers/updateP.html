<html lang="en">

<head th:replace="~{fragments/head::common_head(title=${pagetitle})}">
</head>



<body>
    <div class="container-fluid">
        <div class="row flex-nowrap">
            <div class="col-auto px-2 px-0">
                <div class="d-flex flex-column align-items-start px-3 pt-5 min-vh-100">
                    <!--logo area -->
                    <a th:replace="~{fragments/logoarea::text_logo(text=${pagetextlogo})}"></a>
                    <!--nav menu area-->
                    <div th:replace="~{fragments/homeleftnavS::homeleftnavS}"></div>
                </div>
            </div>
            <div class="col p-0">
                <!-- search bar-->
                <div th:replace="~{fragments/topsearchbar::topsearchbar}"></div>
                <form th:object="${primers}" method = "post" th:action="@{'/primers/updateP/' + *{id}}" autocomplete="off" id="primers_edit_form">
                    <br>
                    <br>
                    <br>
                    <!-- The input text below -->
                    <div class="container-fluid text-left">
                        <div id="header" class="jumbotron alltitle" >
                            <h1 id="title">Edit Primer</h1>
                        </div>
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                            <ul>
                                <li th:each = "error: ${#fields.errors('*')}" th:text="${error}"></li>
                            </ul>
                        </div>

                        <div class="row justify-content-start">
                            <div class="col-md-5">
                                <div id="headerOrientation" class="jumbotron text-left header_U_C_P" >
                                    <p class="lead">Orientation</p>
                                </div>
                                <select th:field = "*{orientations.id}" class="form-control me-2 text-black border-dark btn-sm px-2 input_U_C_P">
                                    <option value = ""></option>
                                    <option th:each = "os : ${orientations}" th:value = "${os.id}" th:text = "${os.name}" th:selected = "${os.id} == *{orientations?.id}"></option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <div id="headerMeltingTemperature" class="jumbotron text-left header_U_C_P" >
                                    <p class="lead">Melting Temperature</p>
                                </div>
                                <input type = "text" th:field = "*{melting_temperature}"class="form-control me-2 text-black border-dark btn-sm px-2 input_U_C_P" maxlength="255">    
                            </div>
                        </div>
                        <br>
                        
                        <div class="row justify-content-start">
                            <div class="col-md-5">
                                <div id="headerConcentration" class="jumbotron header_U_C_P" >
                                    <p class="lead">Concentration</p>
                                </div>
                                <input type = "text" th:field = "*{concentration}" class="form-control me-2 text-black border-dark btn-sm px-2 input_U_C_P" maxlength="255">
                            </div>
                            <div class="col-md-5"> 
                                <div id="headerVendor" class="jumbotron text-left header_U_C_P" >
                                    <p class="lead">Vendor</p>
                                </div>
                                <input type = "text" th:field = "*{vendor}" class="form-control me-2 text-black border-dark btn-sm px-2 input_U_C_P" maxlength="255">
                            </div>
                        </div>
                        <br>

                        <div class="row justify-content-start">
                            <div class="col-md-10"> 
                                <div id="headerDescription" class="jumbotron text-left header_U_C_P" >
                                    <p class="lead">Description *</p>
                                </div>
                                <textarea type = "text" th:field = "*{description}" class="form-control me-2 text-black border-dark btn-sm px-2 input_U_C_P" rows="3" maxlength="255"></textarea>
                            </div>
                        </div>
                        <br>

                        <div class="row justify-content-start">
                            <div class="col-md-10"> 
                                <div id="headerComments" class="jumbotron text-left header_U_C_P" >
                                    <p class="lead">Comments</p>
                                </div>
                                <textarea type = "text" th:field = "*{comments}" class="form-control me-2 text-black border-dark btn-sm px-2 input_U_C_P" rows="3" maxlength="255"></textarea>
                            </div>
                        </div>
                        <br>
                        
                        <div class="row justify-content-start">
                            <div class="col-md-5"> 
                                <div id="headerLocation" class="jumbotron text-left header_U_C_P" >
                                    <p class="lead">Location</p>
                                </div>
                                <input type = "text" th:field = "*{location}" class="form-control me-2 text-black border-dark btn-sm px-2 input_U_C_P" maxlength="255">
                            </div>
                            <div class="col-md-5"> 
                                <!-- The date input -->
                                <div id="headerDate" class="jumbotron text-left header_U_C_P" >
                                    <p class="lead">Date *</p>
                                </div>
                                <!-- <input type="text" th:value = "*{#dates.format(date, 'yyyy-MM-dd HH:mm')}" class="form-control" id="date" name="date" style="max-width: 100%;"> -->
                                <input type="text" id="date" name="date" th:field="*{date}" class="form-control me-2 text-black border-dark btn-sm px-2- input_U_C_P" style="max-width: 100%;">
                            </div>
                        </div>
                        <br>

                        <div class="row justify-content-start">
                            <div class="col-md-10">  
                                <div id="headerSequence" class="jumbotron header_U_C_P" >
                                    <p class="lead">Sequence *</p>
                                </div>
                                <textarea type = "text" th:field = "*{sequence}" class="form-control me-2 text-black border-dark btn-sm px-2- input_U_C_P" rows="8" maxlength="255"></textarea>
                            </div>
                        </div>
                        <br>

                        <div class="row justify-content-start">
                            <div class="col-md-5">
                                <!-- The date input -->
                                <div id="headerPlateID" class="jumbotron text-left header_U_C_P">
                                    <p class="lead">Plate ID</p>
                                </div>
                                <input type="text" th:field="*{Plate_Id}" class="form-control me-2 text-black border-dark btn-sm px-2- input_U_C_P" style="max-width: 100%;">
                            </div>
                            <div class="col-md-5">
                                <!-- The date input -->
                                <div id="headerPlateID" class="jumbotron text-left header_U_C_P">
                                    <p class="lead">Well ID</p>
                                </div>
                                <input type="text" th:field="*{Well_id}" class="form-control me-2 text-black border-dark btn-sm px-2- input_U_C_P" style="max-width: 100%;">
                            </div>
                        </div>
                        <br>
                    
                    </div>

                    <!-- The submit button -->
                    <div class = "position-absolute bottom-1 end-0 p-5">
                        <button class="btn btn-dark btn-lg border-white rounded" name="cancel" type="reset" onclick="history.go(-1)" style="margin-right: 20px;">Cancel</button>
                        <button class="btn btn-dark btn-lg border-white rounded" name="submit" type="submit" style="margin-right: 100px;">Submit +</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/primers.js}"></script>

    <div th:replace="~{fragments/bodyend::bodyend}"></div>

</body>

</html>
