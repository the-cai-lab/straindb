<html lang="en">

<head th:replace="~{fragments/head::common_head(title=${pagetitle})}"> </head>

<body>
    <div class="container-fluid">
        <div class="row flex-nowrap">
            <div class="col-auto px-2 px-0">
                <div class="d-flex flex-column align-items-start px-3 pt-5 min-vh-100">
                    <!--logo area -->
                    <a th:replace="~{fragments/logoarea::text_logo(text=${pagetextlogo})}"></a>
                    <!--nav menu area-->
                    <div th:replace="~{fragments/homeleftnavS::homeleftnavS}"></div>
                </div>
            </div>
            <div class="col p-0">
                <!-- search bar-->
                <div th:replace="~{fragments/topsearchbar::topsearchbar}"></div>


                <div class="pt-5">
                    <!-- Title -->
                    <div id="header" class="jumbotron text-left alltitle">
                        <h1 id="title" class="text-left">Primers</h1>
                    </div>
                    <!-- Buttons for the edit and creates -->
                    <a href="/primers/createP" class="btn btn-dark btn-lg me-4 border-white float-end" role="button">Create New Primer</a>

                    <a href="/primers/createBP" class="btn btn-dark btn-lg me-4 border-white float-end" role="button">Batch Create</a>

                    <div>
                        <!-- Search using select bar instead of multiple links at the top -->
                        <form class="form-group w-10 float-sm-left d-flex">
                            <div class="form-group me-2">
                                <label for="search_personal" class="mb-0" style="font-size: 16px; font-weight: bold;">Select Users:</label>
                                <select class="form-select bg-white text-black me-2" name="search_personal" id="search_personal" aria-label="Search Users" style="border: 2px solid #333; border-radius: 5px;">
                                    <!-- Preselected the current loged in user, but if the user did not have add any primers, it will not show it -->
                                    <option th:each="userPrimersCount : ${userPrimersCountDto}" th:if="${#authentication.principal.id == userPrimersCount.getUserid() }" th:value="${userPrimersCount.getUserid()}" th:text="|${userPrimersCount.getName()} (${userPrimersCount.getNumberOfPrimers()})|" th:selected="${#authentication.principal.id == userPrimersCount.getUserid()}"></option>
                                    <!-- All other users -->
                                    <option value="">All Users</option>
                                    <option th:each="userPrimersCount : ${userPrimersCountDto}" th:unless="${#authentication.principal.id == userPrimersCount.getUserid() }" th:value="${userPrimersCount.getUserid()}" th:text="|${userPrimersCount.getName()} (${userPrimersCount.getNumberOfPrimers()})|"></option>
                                </select>
                                
                            </div>
                        
                            <div class="form-group me-2">
                                <label for="primerSearch" class="mb-0" style="font-size: 16px; font-weight: bold;">Search for all fields in Primers:</label>
                                <input type="text" class="form-control form-control-sm" placeholder="Search primers" aria-controls="Search primers" id="primerSearch" style="height: 40px; font-weight: bold; border: 2px solid #333; border-radius: 5px;">
                            </div>
                        </form>
                    </div>
                    <!-- header for the table -->
                    <div class="container align-items-start mx-0 mt-4"  style="position: relative;">
                        <!--overlay layer when page load-->
                        <div class="overlay" id="overlay">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        <table id="all-primers-data" class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th class="table-headerP">Personal ID</th>
                                    <th class="table-headerP">Lab ID</th>
                                    <th class="table-headerP">Orientation</th>
                                    <th class="table-headerP">Melting Temperature</th>
                                    <th class="table-headerP">Concentration</th>
                                    <th class="table-headerP">Vendor</th>
                                    <th class="table-headerP">Description</th>
                                    <th class="table-headerP">Location</th>
                                    <th class="table-headerP">ID</th>
                                    <th class="table-headerP">User ID</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="pr: ${primers}">
                                    <th class="table-headerP"> <a th:href="@{'/primers/' + ${pr.id}}" th:text="${pr.personal_id}"></a> </th>
                                    <th class="table-headerP"> <a th:href="@{'/primers/' + ${pr.id}}" th:text="${pr.lab_id}"></a> </th>
                                    <td th:text="${pr.orientations?.name}"></td>
                                    <td th:text="${pr.melting_temperature}"></td>
                                    <td th:utext="${pr.concentration}"></td>
                                    <td th:text="${pr.vendor}"></td>
                                    <td th:utext="${pr.description}"></td>
                                    <td th:text="${pr.location}"></td>
                                    <td th:text="${pr.id}"></td>
                                    <td th:text="${pr.user.id}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/bodyend::bodyend}"></div>
    <!-- DataTable initialization -->
    <script>
        $(document).ready(function () {
                let defaultOrderingColumn = 8; //This is ID column index (0-based)
            
                // Overlay the data table during data loading, this is to prevent the user taking any action before the DataTable is loaded
                $('#all-primers-data').on('processing.dt', function (e, settings, processing) {
                    if (processing) {
                        $('#overlay').show();
                    } else {
                        $('#overlay').hide();
                    }
                });

            let primers_table = $('#all-primers-data').DataTable({
                paging: true, // Enable pagination
                pageLength: 1000,  // Show 1000 records per page
                dom: 'lrtip',
                //searching: true,  // Enable search box
                ordering: true, // Enable sorting
                lengthMenu: [1000, 1500, 2000, 2500, 3000, 3500, { label: 'All', value: -1 }], //config the show entries option
                columns: [
                    { data: 'personalId'},
                    { data: 'labId'},
                    { data: 'orientation_id'},
                    { data: 'melting_temperature'},
                    { data: 'concentration'},
                    { data: 'vendor'},
                    { data: 'description', 
                      render: function (data, type, row) {
                            if (type === 'display') {
                                return data.replace(/\S{20,}/g, function (word) {
                                    return word.replace(/.{20}/g, "$&<br>");
                                });
                            }
                            return data;
                       }
                    },
                    { data: 'location'},
                    { data: 'Id', visible: false},
                    { data: 'user', visible: false},
                ],

                search: {
                    regex: true, // Enable regular expression searching
                    smart: false, // Disable smart filtering (search with 2 characters)
                },
                order: [
                    [defaultOrderingColumn, 'desc']
                ],
            });

            $('#search_personal').on('change', function () {
                //When select "all user", it should search with any id (number)
                let selectedUserId = ($(this).val()!="") ? "^" + $(this).val() + "$" : "[0-9]+" ;
                let filterAppliedColumn = 9; //This is User ID column index (0-based)
                
                //console.log(selectedUserId);
                
                // Apply the filter to the DataTable based on the selected user ID
                primers_table.column(filterAppliedColumn)
                             .search("^" + selectedUserId + "$", true, false, true)
                             .draw(); 
            });

            $('#search_personal').change(); //when the page is initially loaded, it will run the select option to ouput the filtered table

            $('#primerSearch').keyup(function(){
                //console.log($(this).val());
                primers_table.search($(this).val()).draw() ;
            });
        });
    </script>
</body>

</html>
