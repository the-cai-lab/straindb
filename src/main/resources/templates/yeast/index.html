<html lang="en">

<head th:replace="~{fragments/head::common_head(title=${pagetitle})}">
</head>



<body>
    <div class="container-fluid">
        <div class="row flex-nowrap">
            <div class="col-auto px-2 px-0">
                <div class="d-flex flex-column align-items-start px-3 pt-5 min-vh-100">
                    <!--logo area -->
                    <a th:replace="~{fragments/logoarea::text_logo(text=${pagetextlogo})}"></a>
                    <!--nav menu area-->
                    <div th:replace="~{fragments/homeleftnavS::homeleftnavS}"></div>
                </div>
            </div>
            <div class="col p-0">
                <!-- search bar-->
                <div th:replace="~{fragments/topsearchbar::topsearchbar}"></div>


                
                <div class="pt-5">
                    <!-- Title -->
                    <div id="header" class="jumbotron text-left alltitle" >
                        <h1 id="title" class="text-left">Yeasts</h1>
                    </div>
                         <a href="/yeast/createY" class="btn btn-dark btn-lg me-4 border-white float-end" role="button">Create New Yeast</a>

                         <a href="/yeast/createBY" class="btn btn-dark btn-lg me-4 border-white float-end" role="button">Batch Create</a>

                         <div>
                    <!-- Search using select bar instead of multiple links at the top -->

                    <form class="form-group w-10 float-sm-left d-flex">
                        <div class="form-group me-2">
                            <label for="search_personal" class="mb-0" style="font-size: 16px; font-weight: bold;">Select Users:</label>
                            <select class="form-select bg-white text-black me-2" name="search_personal" id="search_personal" aria-label="Search Users" style="border: 2px solid #333; border-radius: 5px;">
                                <!-- Preselected the current loged in user, but if the user did not have add any yeast, it will not show it -->
                                <option th:each="userYeastCount : ${userYeastCountDto}" th:if="${#authentication.principal.id == userYeastCount.getUserid()}" th:value="${userYeastCount.getUserid()}" th:text="|${userYeastCount.getName()} (${userYeastCount.getNumberOfYeast()})|" th:selected="${#authentication.principal.id == userYeastCount.getUserid()}"></option>
                                <!-- All other users -->
                                <option value="">All Users</option>
                                <option th:each="userYeastCount : ${userYeastCountDto}" th:unless="${#authentication.principal.id == userYeastCount.getUserid() }" th:value="${userYeastCount.getUserid()}" th:text="|${userYeastCount.getName()} (${userYeastCount.getNumberOfYeast()})|"></option>
                            </select>
                            
                        </div>
                    
                        <div class="form-group me-2">
                            <label for="yeastSearch" class="mb-0" style="font-size: 16px; font-weight: bold;">Search for all fields in Yeast:</label>
                            <input type="text" class="form-control form-control-sm" placeholder="Search yeast" aria-controls="Search yeast" id="yeastSearch" style="height: 40px; font-weight: bold; border: 2px solid #333; border-radius: 5px;">
                        </div>
                    </form>
                    </div>
                    <!-- header for the table -->
                    <div class="container align-items-start mx-0 mt-4"  style="position: relative;">
                        <!--overlay layer when page load-->
                        <div class="overlay" id="overlay">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        <table id="all-yeast-data" class="table table-striped table-hover">
                            <thead>
                              <tr>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>Personal ID</th>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>Lab ID</th>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>Other Names</th>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>Mating Type</th>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>Genotype</th>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>Plasmid</th>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>Plasmid Type</th>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>Parent Name</th>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>Other Parent Type</th>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>Markers</th>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>Comments</th>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>Location</th>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>ID</th>
                                <th class = "table-headerY"><i class="fas fa-bolt"></i>User ID</th>
                              </tr>
                            </thead>
                            <tbody>
                                <tr th:each="ye: ${yeast}">
                                    <th class="table-headerY">
                                        <a th:href="@{'/yeast/' + ${ye.id}}" th:text="${ye.personal_id}"></a>
                                    </th>
                                    <th class="table-headerY">
                                        <a th:href="@{'/yeast/' + ${ye.id}}" th:text="${ye.lab_id}"></a>
                                    </th>
                                    <td th:text="${ye.other_names}"></td>
                                    <td th:text="${ye.mating_types?.name}"></td>
                                    <td th:utext="${ye.genotype}"></td>
                                    <td th:utext="${ye.plasmid}"></td>
                                    <td th:text="${ye.plasmid_type}"></td>
                                    <td th:text="${ye.parent_name1}"></td>
                                    <td th:text="${ye.parent_name2}"></td>
                                    <td th:text="${ye.markers_list}"></td>
                                    <td th:utext="${ye.comments}"></td>
                                    <td th:text="${ye.location}"></td>
                                    <td th:text="${ye.id}"></td>
                                    <td th:text="${ye.user.id}"></td>
                                </tr>
                            </tbody>
                            </table>
                        </div>
                    </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/bodyend::bodyend}"></div>


    <script>
        $(document).ready(function () {
            let defaultOrderingColumn = 12; //This is ID column index (0-based)    
            
                // Overlay the data table during data loading, this is to prevent the user taking any action before the DataTable is loaded
                $('#all-yeast-data').on('processing.dt', function (e, settings, processing) {
                    if (processing) {
                        $('#overlay').show();
                    } else {
                        $('#overlay').hide();
                    }
                });

            let yeast_table = $('#all-yeast-data').DataTable({
                paging: true,  // Enable pagination
                pageLength: 1000,  // Show 1000 records per page
                dom: 'lrtip',
                //searching: true,  // Enable search box
                ordering: true,  // Enable sorting
                lengthMenu: [1000, 1500, 2000, 2500, 3000, 3500, { label: 'All', value: -1 }], //config the show entries option
                columns: [
                    { data: 'personalId'},
                    { data: 'labId'},
                    { data: 'other_name'},
                    { data: 'mating_type'},
                    { data: 'genotype'},
                    { data: 'plasmid'},
                    { data: 'plasmid_type'},
                    { data: 'parent_name1'},
                    { data: 'parent_name2'},
                    { data: 'marker'},
                    { data: 'comments', 
                      render: function (data, type, row) {
                        if (type === 'display') {
                            return data.replace(/\S{20,}/g, function (word) {
                                return word.replace(/.{20}/g, "$&<br>");
                            });
                        }
                        return data;
                        }
                    },
                    { data: 'location'},
                    { data: 'Id', visible: false},
                    { data: 'user', visible: false}
                ],

                search: {
                    regex: true,  // Enable regular expression searching
                    smart: false, // Disable smart filtering (search with 2 characters)
                },
                order: [
                    [defaultOrderingColumn, 'desc']
                ],
            });


            $('#search_personal').on('change', function () {
                //When select "all user", it should search with any id (number)
                let selectedUserId = ($(this).val()!="") ? "^" + $(this).val() + "$" : "[0-9]+" ;
                let filterAppliedColumn = 13; //This is User ID column index (0-based)

                //console.log(selectedUserId);

                
                // Apply the filter to the DataTable based on the selected user ID
                yeast_table.column(filterAppliedColumn)
                            .search("^" + selectedUserId + "$", true, false, true) //search(input, regx, smart search, not case sensitive )
                            .draw(); //user ID is in the 13 column (index 12)


            });

            $('#search_personal').change(); //when the page is initially loaded, it will run the select option to ouput the filtered table

            $('#yeastSearch').keyup(function(){
                //console.log($(this).val());
                yeast_table.search($(this).val()).draw() ;
            });
        });
    </script> 
</body>

</html>
