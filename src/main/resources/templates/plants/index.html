<html lang="en">
<head th:replace="~{fragments/head::common_head(title=${pagetitle})}">
</head>    
<body>
    <div class="container-fluid">
        <div class="row flex-nowrap">
            <div class="col-auto px-2 px-0">
                <div class="d-flex flex-column align-items-start px-3 pt-5 min-vh-100">
                    <!--logo area -->
                    <a th:replace="~{fragments/logoarea::text_logo(text=${pagetextlogo})}"></a>
                    <!--nav menu area-->
                    <div th:replace="~{fragments/homeleftnavS::homeleftnavS}"></div>
                </div>
            </div>

            <div class="col p-0">
                <div class="pt-5">
                    <!-- Title -->
                    <div id="header" class="jumbotron text-left alltitle">
                        <h1 id="title" class="text-left">Plants</h1>
                    </div>

                    <!-- Buttons for the edit and creates -->
                    <a href="/plants/create" class="btn btn-dark btn-lg me-4 border-white float-end" role="button">Create New Plants</a>
                    <a href="/plants/createBatch" class="btn btn-dark btn-lg me-4 border-white float-end" role="button">Batch Create</a>

                    <div>
                        <form class="form-group w-10 float-sm-left d-flex">
                            <div class="form-group me-2">
                                <label for="search_personal" class="mb-0" style="font-size: 16px; font-weight: bold;">Select Users:</label>
                                <select class="form-select bg-white text-black me-2" name="search_personal" id="search_personal" aria-label="Search Users" style="border: 2px solid #333; border-radius: 5px;">
                                    <!-- Preselected the current loged in user, but if the user did not have add any plants, it will not show it -->
                                    <option th:each="userPlantsCount : ${userPlantsCountDto}" th:if="${#authentication.principal.id == userPlantsCount.getUserid() }" th:value="${userPlantsCount.getUserid()}" th:text="|${userPlantsCount.getName()} (${userPlantsCount.getNumberOfPlants()})|" th:selected="${#authentication.principal.id == userPlantsCount.getUserid()}"></option> 
                                    <!-- All other users -->
                                    <option value="">All Users</option>
                                    <option th:each="userPlantsCount : ${userPlantsCountDto}" th:unless="${#authentication.principal.id == userPlantsCount.getUserid() }" th:value="${userPlantsCount.getUserid()}" th:text="|${userPlantsCount.getName()} (${userPlantsCount.getNumberOfPlants()})|"></option>
                                </select>
                            </div>

                            <div class="form-group me-2">
                                <label for="plantsSearch" class="mb-0" style="font-size: 16px; font-weight: bold;">Search for all fields in Plants:</label>
                                <input type="text" class="form-control form-control-sm" placeholder="Search plants" aria-controls="Search plants" id="plantsSearch" style="height: 40px; font-weight: bold; border: 2px solid #333; border-radius: 5px;">
                            </div>
                        </form>
                    </div>

                    <!-- header for the table -->
                    <div class="container align-items-start mx-0 mt-4" style="position: relative;">
                        <!--overlay layer when page load-->
                        <div class="overlay" id="overlay">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>

                        <table id="all-plants-data" class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th class="table-headerB"> Personal Id</th>
                                    <th class="table-headerB"> Lab Id</th>
                                    <th class="table-headerB"> Name</th>
                                    <th class="table-headerB"> Growth Conditions</th>
                                    <th class="table-headerB"> Genotype</th>
                                    <th class="table-headerB"> Source</th>
                                    <th class="table-headerB"> Marker</th>
                                    <th class="table-headerB"> Media</th>
                                    <th class="table-headerB"> Species</th>
                                    <th class="table-headerB"> Comments</th>
                                    <th class="table-headerB"> Location</th>
                                    <!-- for searching-->
                                    <th class="table-headerB">Id</th>
                                    <th class="table-headerB">User Id</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="pl : ${plants}">
                                    <th class="table-headerB">
                                        <a th:href="@{'/plants/' + ${pl.id}}" th:text="${pl.personal_id}"></a>
                                    </th>
                                    <th class="table-headerB">
                                        <a th:href="@{'/plants/' + ${pl.id}}" th:text="${pl.lab_id}"></a>
                                    </th>
                                    <td th:text="${pl.name}"></td>
                                    <td th:text="${pl.growthConditions}"></td>
                                    <td th:text="${pl.genotype}"></td>
                                    <td th:text="${pl.source}"></td>
                                    <td th:text="${pl.marker}"></td>
                                    <td th:text="${pl.media}"></td>
                                    <td th:text="|${pl.plantSpecies.scientific_name} (${pl.plantSpecies.ncbiid})|"></td>
                                    <td th:utext="${pl.comments}"></td>
                                    <td th:text="${pl.location}"></td>
                                    <td th:text="${pl.id}">Id</td>
                                    <td th:text="${pl.user.id}">User Id</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/bodyend::bodyend}"></div>
    <script>
        $(document).ready(function () {
            let defaultOrderingColumn = 11; // Default ordering by the 'id' column, which is the 12th column (0-indexed)

            // Overlay the data table during data loading, this is to prevent the user taking any action before the DataTable is loaded
            $('#all-plants-data').on('processing.dt', function (e, settings, processing) {
                if (processing) {
                    $('#overlay').show();
                } else {
                    $('#overlay').hide();
                }
            });

            // Create a DataTable instance and apply the necessary configuration
            let plants_table = $('#all-plants-data').DataTable({
                    paging: true,  // Enable pagination
                    pageLength: 1000,  // Show 1000 records per page
                    dom: 'lrtip',
                    ordering: true,  // Enable sorting
                    lengthMenu: [1000, 1500, 2000, 2500, 3000, 3500, { label: 'All', value: -1 }], //config the show entries option
                    columns: [
                        { data: 'personalId'},
                        { data: 'labId'},
                        { data: 'name'},
                        { data: 'growthConditions'},
                        { data: 'genotype'},
                        { data: 'source'},
                        { data: 'marker'},
                        { data: 'media'},
                        { data: 'species'},
                        { 
                            data: 'comments', 
                            // Render the 'Comments' column as a String
                            // If the comments contain words that exceeds 20 characters, it will be add a <br> tag to the words
                            // The full comments will be displayed.
                            // for example, the Comments is "This comments contain a very long string that is abcdefghijklmnopqrstuvwxyzabcedgfijklmnopqrstuvwxyzabcdefghijklmno. It is really long."
                            // It will be displayed as "This comments contain a very long string that is abcdefghijklmnopqrst<br>uvwxyzabcedgfijklmno<br>pqrstuvwxyzabcdefghi<br>jklmno. It is really long."
                            // The logic is 
                            // 1. by using regx, found the word that is longer than 20 characters
                            // 2. get that word with longer than 20 characters
                            // 3. loop through each char in the word, get char from index 0 to index 20 then add a <br> tag, then from index 20 to index 40, add a <br> tag, and so on until the end of the word
                            // 4. replace the original word with the new word that contains <br> tag
                            // 5. return the modified comments
                            render: function (data, type, row) {
                                if (type === 'display') {
                                    return data.replace(/\S{20,}/g, function (word) { //is looking for any sequence of non-whitespace characters (`\S`) that are 20 characters or longer (`{20,}`). The `g` flag at the end of the regular expression means that this pattern will be searched for globally in the string
                                        return word.replace(/.{20}/g, "$&<br>"); // looking for any sequence of characters that are exactly 20 characters long (`.{20}`). For each of these sequences that it finds, it replaces them with the sequence itself (`$&`) followed by a HTML line break (`<br>`).
                                    });
                                }
                                return data;
                            }
                        },
                        { data: 'location'},
                        { data: 'id', title: 'Id', visible: false }, // Hidden column
                        { data: 'userid', title: 'User Id', visible: false }, // Hidden column
                    ],

                    search: {
                        regex: true,  // Enable regular expression searching
                        smart: false, // Disable smart filtering (search with 2 characters)
                    },
                    order: [
                        // Sort by the 'id' column in descending order
                        [defaultOrderingColumn, 'desc']
                    ],
                });

                $('#search_personal').on('change', function () {
                    //When select "all user", it should search with any id (number)
                    let selectedUserId = ($(this).val()!="") ? "^" + $(this).val() + "$" : "[0-9]+" ;
                    let filterAppliedColumn = 12; //This is User ID column index (0-based)
                    
                    // Apply the filter to the DataTable based on the selected user ID
                    plants_table.column(filterAppliedColumn)
                                      .search("^" + selectedUserId + "$", true, false, true)
                                      .draw(); 
                });

                $('#search_personal').change(); //when the page is initially loaded, it will run the select option to ouput the filtered table

                $('#plantsSearch').keyup(function(){
                    //console.log($(this).val());
                    plants_table.search($(this).val()).draw() ;
                });
        });            
    </script>
</body>
</html>
