<html lang="en">

<head th:replace="~{fragments/head::common_head(title=${pagetitle})}"> </head>

<body>
    <div class="container-fluid">
        <div class="row flex-nowrap">
            <div class="col-auto px-2 px-0">
                <div class="d-flex flex-column align-items-start px-3 pt-5 min-vh-100">
                    <!--logo area -->
                    <a th:replace="~{fragments/logoarea::text_logo(text=${pagetextlogo})}"></a>
                    <!--nav menu area-->
                    <div th:replace="~{fragments/homeleftnavS::homeleftnavS}"></div>
                </div>
            </div>
            <div class="col p-0">
                <!-- search bar-->
                <div th:replace="~{fragments/topsearchbar::topsearchbar}"></div>

                <div class="container-fluid text-left">
                    <br />
                    <br />
                    <br />
                    <br />
                    <!-- title -->
                    <div id="header" class="jumbotron alltitle">
                        <h1 id="title" th:text="|${bacteria.getPersonal_id()}, ${bacteria.getLab_id()} |"></h1>
                    </div>
                    <!-- links for new and edit -->
                    <a th:if="${#authentication.principal.id == bacteria.user.getId() }" th:href="@{'/bacteria/updateB/' + ${bacteria.getId()}}" class="btn btn-dark btn-lg me-4 border-white float-end" role="button">Edit</a>
                    <a href="/bacteria/createB" class="btn btn-dark btn-lg me-4 border-white float-end" role="button">New</a>
                    <br />
                    <br />
                    <!-- table for the data -->
                    <div class="container-fluid text-left">
                        <table class="table">
                            <tbody>
                                <tr>
                                    <th>Personal ID</th>
                                    <th th:text="${bacteria.getPersonal_id()}"></th>
                                </tr>
                                <tr>
                                    <th>Lab ID</th>
                                    <th th:text="${bacteria.getLab_id()}"></th>
                                </tr>
                                <tr>
                                    <th>Plasmid Name</th>
                                    <th th:text="${bacteria.getPlasmid_name()}"></th>
                                </tr>
                                <tr>
                                    <th>Alternative Name</th>
                                    <th th:text="${bacteria.getAlternate_name()}"></th>
                                </tr>
                                <tr>
                                    <th>Genotype</th>
                                    <th th:text="${bacteria.getGenotype()}"></th>
                                </tr>
                                <tr>
                                    <th>Host Strain</th>
                                    <th th:utext="${bacteria.getHost_strain()}"></th>
                                </tr>
                                <tr>
                                    <th>Marker</th>
                                    <th th:text="${bacteria.getBacterialMarkers()?.getName()}"></th>
                                </tr>
                                <tr>
                                    <th>Other Marker</th>
                                    <th th:text="${bacteria.getOther_bacterial_marker()}"></th>
                                </tr>                                
                                <tr>
                                    <th>Comments</th>
                                    <th th:utext="${bacteria.getComments()}"></th>
                                </tr>
                                <tr>
                                    <th>Location</th>
                                    <th th:text="${bacteria.getLocation()}"></th>
                                </tr>
                                <tr>
                                    <th>Date</th>
                                    <th th:text="${#dates.format(bacteria.getDate(), 'yyyy-MM-dd HH:mm:ss')}"></th>
                                </tr>
                                <tr th:if="${!#strings.isEmpty(bacteria.getAttachment_file_name())}">
                                    <th>File</th>
                                    <th><a th:href="@{/upload/__${bacteria.getUser.getId}__/__${bacteria.getId}__/__${bacteria.getAttachment_file_name}__}">Download</a></th>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/bodyend::bodyend}"></div>
</body>

</html>
