<html lang="en">

<head th:replace="~{fragments/head::common_head(title=${pagetitle})}">
</head>



<body>
    <div class="container-fluid">
        <div class="row flex-nowrap">
            <div class="col-auto px-2 px-0">
                <div class="d-flex flex-column align-items-start px-3 pt-5 min-vh-100">
                    <!--logo area -->
                    <a th:replace="~{fragments/logoarea::text_logo(text=${pagetextlogo})}"></a>
                    <!--nav menu area-->
                    <div th:replace="~{fragments/homeleftnavS::homeleftnavS}"></div>
                </div>
            </div>
            <div class="col p-0">
                <!-- search bar-->
                <div th:replace="~{fragments/topsearchbar::topsearchbar}"></div>


                
                <div class="pt-5">
                    <!-- Title -->
                    <div id="header" class="jumbotron text-left alltitle" >
                        <h1 id="title" class="text-left">Users</h1>
                    </div>
                    <label for="userSearch" class="mb-0" style="font-size: 16px; font-weight: bold;">Search for all fields in Users:</label>
                    <div class="d-flex align-items-center">
                        <form class="form-group me-2 mb-0">
                            <!-- <label for="userSearch" class="mb-0" style="font-size: 16px; font-weight: bold;">Search for all fields in Users:</label> -->
                            <input type="text" class="form-control form-control-sm" placeholder="Search user" aria-controls="Search user" id="userSearch" style="height: 40px; font-weight: bold; border: 2px solid #333; border-radius: 5px; width: 1100px;">
                        </form>
                        <a href="/users/createU" class="btn btn-dark btn-lg me-4 border-white" role="button">Create New Users</a>
                    </div>
                    
                    <div>
                    <!-- message -->
                    <div th:if="${resetpasswordURL}" class="message alert alert-info">
                        Please send this link to user for reset password:<br> 
                        <span th:text="${resetpasswordURL}"></span>
                    </div>
                    <div th:if="${resetpassword_error}" class="alert alert-danger">
                        <ul>
                            <span th:text="${resetpassword_error}"></span>
                        </ul>
                    </div>
                    <!-- header for the table -->
                       <div class="container align-items-start mx-0 mt-4">
                        <table class="table table-striped table-hover" id = "users_table">
                            <thead>
                              <tr>
                                <th class = "table-headerU">Name</th>
                                <th class = "table-headerU">Email</th>
                                <th class = "table-headerU">Level</th>
                                <th class = "table-headerU">Deactivated</th>
                                <th class = "table-headerU">Bacteria</th>
                                <th class = "table-headerU">Primers</th>
                                <th class = "table-headerU">Yeast</th>
                                <th class = "table-headerU">Mammalian</th>
                                <th class = "table-headerU">Plants</th>
                                <th class = "table-headerU">Reset Password</th>
                                <th class = "table-headerU">View</th>
                              </tr>
                            </thead>
                            <!-- layout for the users table -->
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <th class="table-headerP"><p th:text="${user.name}"></p></th>
                                    <th class="table-headerP"><p th:text="${user.email}"></p></th>
                                    <th class="table-headerP"><p th:text="${user.userRole.role}"></p></th>
                                    <!-- additional column for the table -->
                                    <!-- will need to edit the database table -->
                                    <td style="text-align: center; vertical-align: top;">
                                        <input type="checkbox" name="deactivate" th:checked="${user.deactivate}" disabled="disabled">
                                        <p style='visibility: hidden; display: none;' th:text="${user.deactivate}"></p>
                                    </td>                                    
                                    <!--make use collection projection to check for the existence of each element of each user-->
                                    <!--Bacteria-->
                                    <td th:with="has_bacteria = ${#lists.contains(userBacteriaCountDto.![userid],  user.id )}">
                                        <div th:if="${has_bacteria}">
                                            <div th:each="userBacteriaCount : ${userBacteriaCountDto}">
                                                <span th:if="${userBacteriaCount.userid == user.id}" th:text="${userBacteriaCount.getNumberOfBacteria()}"></span>
                                            </div>
                                        </div>
                                        <div th:unless="${has_bacteria}">
                                            <span>0</span>
                                        </div>
                                    </td>
                                    
                                    <!--Primers-->
                                    <td th:with="has_primers = ${#lists.contains(userPrimersCountDto.![userid],  user.id )}">
                                        <div th:if="${has_primers}">
                                            <div th:each="userPrimersCount : ${userPrimersCountDto}">
                                                <span th:if="${userPrimersCount.userid == user.id}" th:text="${userPrimersCount.getNumberOfPrimers()}"></span>
                                            </div>
                                        </div>
                                        <div th:unless="${has_primers}">
                                            <span>0</span>
                                        </div>
                                    </td>
                                    
                                    <!--Yeast-->
                                    <td th:with="has_yeast = ${#lists.contains(userYeastCountDto.![userid],  user.id )}">
                                        <div th:if="${has_yeast}">
                                            <div th:each="userYeastCount : ${userYeastCountDto}">
                                                <span th:if="${userYeastCount.userid == user.id}" th:text="${userYeastCount.getNumberOfYeast()}"></span>
                                            </div>
                                        </div>
                                        <div th:unless="${has_yeast}">
                                            <span>0</span>
                                        </div>
                                    </td>
                                    <!--Mammalian-->
                                    <td th:with="has_mammalian = ${#lists.contains(userMammalianCountDto.![userid],  user.id )}">
                                        <div th:if="${has_mammalian}">
                                            <div th:each="userMammalianCount : ${userMammalianCountDto}">
                                                <span th:if="${userMammalianCount.userid == user.id}" th:text="${userMammalianCount.getNumberOfMammalians()}"></span>
                                            </div>
                                        </div>
                                        <div th:unless="${has_mammalian}">
                                            <span>0</span>
                                        </div>
                                    </td> 
                                    <!--Plants-->
                                    <td th:with="has_plants = ${#lists.contains(userPlantsCountDto.![userid],  user.id )}">
                                        <div th:if="${has_plants}">
                                            <div th:each="userPlantsCount : ${userPlantsCountDto}">
                                                <span th:if="${userPlantsCount.userid == user.id}" th:text="${userPlantsCount.getNumberOfPlants()}"></span>
                                            </div>
                                        </div>
                                        <div th:unless="${has_plants}">
                                            <span>0</span>
                                        </div>
                                    </td>                                                                       
                                    <td>
                                        <button type="button" class="user__btn--resetPassword">Reset Password</button>
                                    </td>
                                    <th>
                                        <a th:href="@{'/users/' + ${user.id}}" class="btn btn-dark btn-lg me-4 border-white float-end" role="button">
                                            View
                                        </a>
                                    </th>  
                                </tr>
                            </tbody>
                            </table>
                        </div>
                    </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/users.js}"></script>
    <div th:replace="~{fragments/bodyend::bodyend}"></div>
</body>

</html>
