<html lang="en">

<head th:replace="~{fragments/head::common_head(title=${pagetitle})}">
</head>



<body>
    <div class="container-fluid">
        <div class="row flex-nowrap">
            <div class="col-auto px-2 px-0">
                <div class="d-flex flex-column align-items-start px-3 pt-5 min-vh-100">
                    <!--logo area -->
                    <a th:replace="~{fragments/logoarea::text_logo(text=${pagetextlogo})}"></a>
                    <!--nav menu area-->
                    <div th:replace="~{fragments/homeleftnavS::homeleftnavS}"></div>
                </div>
            </div>
            <div class="col p-0">
                <!-- search bar-->
                <div th:replace="~{fragments/topsearchbar::topsearchbar}"></div>
                <form th:object="${users}" method="post" th:action="@{'/users/createU'}" autocomplete="off" id="users_create_form">
                    <br>
                    <br>
                    <br>
                    <!-- The input text below -->
                    <div class="container-fluid text-left">
                        <div id="header" class="jumbotron alltitle" >
                            <h1 id="title">Create users</h1>
                            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                                <ul>
                                    <li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li>
                                </ul>
                            </div>
                        </div>


                        <div class="container-fluid text-left">
                            <div class="row justify-content-start">
                                <div class="col-md-5"> 
                                    <div id="headerFirstName" class="jumbotron text-left header_U_C_P" >
                                        <p class="lead">First Name *</p>
                                    </div>
                                    <input type="text" th:field="*{firstname}" class="form-control me-2 text-black border-dark btn-sm px-2- input_U_C_P" maxlength="255" />
                                    <br>
                                </div>
                                <div class="col-md-5"> 
                                    <div id="headerLastName" class="jumbotron text-left header_U_C_P" >
                                        <p class="lead">Last Name *</p>
                                    </div>
                                    <input type="text" th:field="*{lastname}" class="form-control me-2 text-black border-dark btn-sm px-2- input_U_C_P" maxlength="255" />
                                    <br>
                                </div>
                                <div class="col-md-5"> 
                                    <div id="headerEmail" class="jumbotron text-left header_U_C_P">
                                        <p class="lead">Email *</p>
                                    </div>
                                    <input type="email" th:field="*{email}" class="form-control me-2 text-black border-dark btn-sm px-2- input_U_C_P" maxlength="255" />
                                    <br>
                                </div>
                            </div>
                            <br>
                            <div class="row justify-content-start">
                                <div class="col-md-5"> 
                                    <div id="headerPassword" class="jumbotron text-left header_U_C_P" >
                                        <p class="lead">Password *</p>
                                    </div>
                                    <input type="text" th:field="*{encrypted_password}" class="form-control me-2 text-black border-dark btn-sm px-2- input_U_C_P" maxlength="255">
                                    <br>
                                </div>
                                <div class="col-md-5"> 
                                    <div id="headerRole" class="jumbotron text-left header_U_C_P">
                                        <p class="lead">Role *</p>
                                    </div>
                                    <select th:field="*{userRole.id}" class="form-control bg-white text-black me-2" >
                                        <option th:each="ur : ${userrole}" th:value="${ur.id}" th:text="${ur.role}"></option>
                                    </select>
                                    <br>
                                </div>
                            </div>
                            
                        </div>


                        <br>
                    </div>

                    <!-- The submit button -->
                    <div class = "position-absolute bottom-1 end-0 p-5">
                        <button class="btn btn-dark btn-lg border-white rounded" name="submit" value="submit" style="margin-right: 100px;">Submit +</button>
                    </div>
                </form>
        </div>
    </div>
</div>


<div th:replace="~{fragments/bodyend::bodyend}"></div>

</body>

</html>
