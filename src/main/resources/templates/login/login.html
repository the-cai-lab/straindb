<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/head::common_head(title=${pagetitle})}"></head>

<body>
	<div class="container-fluid">
		<div class="row min-vh-100">
			<div class="col-12 d-flex justify-content-center align-items-center">
				<div class="text-center">
					<!-- Logo area centered -->
					<a href="/" class="text-black text-decoration-none">
						<span class="d-sm-inline sidenavfont sidenavtitle" style="font-size: 60px;">My Lab</span>
					</a>
					<!-- <h1>Please Log In</h1> -->
					<div th:if="${param.error}">
						Invalid username and password.
					</div>
					<div th:if="${param.logout}">
						You have been logged out.
					</div>
					<form th:action="@{/login}" method="post">
						<br>
						<div>
							<input type="text" name="username" placeholder="Username" class="form-control rounded" />
						</div>
						<br>
						<div>
							<input type="password" name="password" placeholder="Password" class="form-control rounded" />
						</div>
						<!-- Center-align the login button -->
						<br>
						<div class="text-center">
							<input type="submit" value="Log in" class="btn btn-primary rounded" />
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
	
</body>

</html>
