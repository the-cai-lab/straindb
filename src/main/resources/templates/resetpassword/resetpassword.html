<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/head::common_head(title=${pagetitle})}">
</head>	

<body>
	<div class="container-fluid">
		<div class="row min-vh-100">
			<div class="col-12 d-flex justify-content-center align-items-center">
				<div class="text-center">
					<!-- Logo area centered -->
					<a th:replace="~{fragments/logoarea::text_logo(text=${pagetextlogo})}"></a>
                    <div th:if="${updatenewpassword_ok}" class="message alert alert-info">
                        <span th:text="${updatenewpassword_ok}"></span>
                    </div>
                    <div th:if="${error !=null and updatenewpassword_ok == null}" class="alert alert-danger">
                        <span th:text="${error}"></span>
                    </div>
					<form th:if="${error == null and updatenewpassword_ok == null}" th:action="@{/reset-password}" method="post" autocomplete="off" id="reset_password_form">
					        <br>
					        <p>Please enter your new password twice in order to reset it:</p>
					        <br>
						<div>
							<div class="alert alert-danger" id="newpasswordError" style="display: none;"></div>
                            <input type="password" name="newpassword" id="newpassword" placeholder="New password" class="form-control rounded" />
						</div>
						<br>
						<div>
							<input type="password" name="renewpassword" id="renewpassword" placeholder="New password again" class="form-control rounded" />
						</div>
                        <div>
							<input type="hidden" name="resetpasswordtoken" placeholder="resetpasswordtoken" th:value="${resetpasswordtoken}"/>
						</div>
						<!-- Center-align the login button -->
						<br>
						<div class="text-center">
							<input type="submit" value="Submit" class="btn btn-primary rounded" />
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
    <script th:src="@{/js/resetpassword.js}"></script>
</body>

</html>
